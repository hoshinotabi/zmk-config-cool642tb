---
# A_v0.3-fix の build.yaml に「ログ付き右手側」を 1 本追加したもの。
# 既存の 3 本はそのままなので、通常ファームも同時に得られます。
include:
  - board: seeeduino_xiao_ble
    shield: cool642tb_R
    snippet: studio-rpc-usb-uart
  - board: seeeduino_xiao_ble
    shield: cool642tb_L
  - board: seeeduino_xiao_ble
    shield: settings_reset

  # --- 診断用：USB ログ有効の右手側 -------------------------------
  # studio スニップットは意図的に外しています（CDC の競合を避けるため）。
  # LOG_PROCESS_THREAD_STARTUP_DELAY_MS は起動直後のログを
  # コンソール接続後まで保留するための紐です。
  - board: seeeduino_xiao_ble
    shield: cool642tb_R
    cmake-args: -DCONFIG_ZMK_USB_LOGGING=y -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
    artifact-name: cool642tb_R_logging
