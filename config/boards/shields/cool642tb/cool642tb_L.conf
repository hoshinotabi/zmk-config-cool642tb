CONFIG_NFCT_PINS_AS_GPIOS=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Peripheral only reports its own battery; the CENTRAL_* options below
# do not exist in a peripheral build and were removed.
CONFIG_ZMK_BATTERY_REPORTING=y

# Match the central's link settings (2M PHY off) for a stable split link.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
