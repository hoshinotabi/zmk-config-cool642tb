# 段階 2: 接続パラメータを「幅を持たせて」要求する版
#
# 段階 1（EXPERIMENTAL_SEC 化）に加え、Apple 準拠の接続間隔を
# 15ms～30ms の範囲で要求する。左半分（cool642tb_L.conf）は変更不要。
#
# ホストがこの範囲から自分に適した値を選ぶため、
# iPad は速い側、macOS は従来どおりという振る舞いが期待できる。
# それでもラグが残る場合は MAX_INT を 12 に詰める（15ms 固定）。

CONFIG_ZMK_KEYBOARD_NAME="cool642tb"
CONFIG_NFCT_PINS_AS_GPIOS=y

# --- pointing / mouse ---------------------------------------------------
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# --- bluetooth ----------------------------------------------------------
CONFIG_ZMK_BLE=y

# 段階 1 の変更（維持）。2M PHY を生かすため CONN は入れない。
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- 段階 2: 接続パラメータ -------------------------------------------
# 単位は 1.25ms 。 12 = 15ms 、 24 = 30ms 。
# Apple のガイドラインは最短 15ms 、かつ 15ms の倍数を要求する。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24

# スレーブレイテンシ 0 。これが残ると静止後の初動が鈍る。
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# 監視タイムアウト 400 = 4 秒。
# （間隔 × (1 + レイテンシ) × 3 を上回り、且つ 6 秒以下である必要がある。
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# 接続確立後に上記の希望値を自動で要求する。これがないと
# ホストが決めた初期値のまま放置されることがある。
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# --- trackball ----------------------------------------------------------
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=600
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_PMW3610_SCROLL_TICK=16
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_MOVEMENT_THRESHOLD=5
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_POLLING_RATE_125_SW=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=700
CONFIG_PMW3610_SMART_ALGORITHM=y

# --- encoder ------------------------------------------------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- battery ------------------------------------------------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- studio -------------------------------------------------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
