CONFIG_ZMK_KEYBOARD_NAME="cool642tb"
CONFIG_NFCT_PINS_AS_GPIOS=y

# --- pointing / mouse ---------------------------------------------------
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# --- bluetooth ----------------------------------------------------------
CONFIG_ZMK_BLE=y

# 変更点 1: EXPERIMENTAL_FEATURES を分解し、SEC だけ残す。
#   FEATURES = CONN + SEC 。CONN は 2M PHY を無効化するため、
#   ポインタのような高頻度レポートには不利。
#   接続の不安定さが戻ったら CONN を y に戻してください。
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 変更点 2: Apple 準拠の接続パラメータを明示要求する。
#   単位は 1.25ms 。 12 = 15ms（Apple が許容する最短間隔）。
#   iPadOS はガイドライン外の要求を拒否し、遅い間隔のまま維持する。
#   macOS は寛容なため、今回のような差が生じる。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# --- trackball ----------------------------------------------------------
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=600
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_PMW3610_SCROLL_TICK=16
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_MOVEMENT_THRESHOLD=5
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_POLLING_RATE_125_SW=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=700
CONFIG_PMW3610_SMART_ALGORITHM=y

# --- encoder ------------------------------------------------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- battery ------------------------------------------------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- studio -------------------------------------------------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
