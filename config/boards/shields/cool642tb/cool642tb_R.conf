# 段階 3（低レイテンシ優先版）: 接続間隔を 15ms に固定
#
# 段階 2 では MAX_INT=24（30ms）と幅を持たせたため、
# macOS が遅い側（30ms）に落ち着いてしまったと推定される。
# ここでは幅を潰し、15ms 以外を選べないようにする。
#
# 電力消費は増えるが、iPad と macOS の両方で最速となる。

CONFIG_ZMK_KEYBOARD_NAME="cool642tb"
CONFIG_NFCT_PINS_AS_GPIOS=y

# --- pointing / mouse ---------------------------------------------------
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# --- bluetooth ----------------------------------------------------------
CONFIG_ZMK_BLE=y

# 2M PHY を生かすため CONN は入れない。
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- 接続パラメータ（単位 1.25ms）-------------------------------------
# 12 = 15ms 。上下を同じ値にして「これ以外は認めない」とする。
# Apple の要求は「最短 15ms 、かつ 15ms の倍数」なので、
# 15ms 固定は iPad でも安全に通る。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# ホストが 15ms 固定の要求を拒んだ場合の退避策としては、
# MAX_INT を 24 に戻す（= 段階 2 相当）。

# --- trackball ----------------------------------------------------------
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=600
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_PMW3610_SCROLL_TICK=16
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_MOVEMENT_THRESHOLD=5
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_POLLING_RATE_125_SW=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=700
CONFIG_PMW3610_SMART_ALGORITHM=y

# --- encoder ------------------------------------------------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- battery ------------------------------------------------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- studio -------------------------------------------------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
